<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c0f">
  <title>SM AVTO BASE</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>
    /* тема до отрисовки, чтобы не мигало: светлая 8:00–18:00, иначе тёмная; ручной выбор — до следующего переключения */
    (function () {
      var h = new Date().getHours(), t = h >= 8 && h < 18 ? 'light' : 'dark';
      try { var o = JSON.parse(localStorage.getItem('sm.themeOverride') || 'null'); if (o && o.until > Date.now()) t = o.theme; } catch (e) {}
      document.documentElement.setAttribute('data-theme', t);
      var m = document.querySelector('meta[name=theme-color]'); if (m) m.setAttribute('content', t === 'dark' ? '#0b0c0f' : '#f2f3f7');
      try { var l = localStorage.getItem('ms_lang'); if (l === 'uz' || l === 'uzc') document.documentElement.lang = l === 'uz' ? 'uz' : 'uz-Cyrl'; } catch (e) {}
    })();
  </script>
  <link rel="preload" href="assets/fonts/onest-cyr.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/admin.css?v=5">
</head>

  <script src="assets/js/pages/money.js?v=5"></script>
  <script src="assets/js/pages/docs.js?v=5"></script>
  <script src="assets/js/pages/admin.js?v=5"></script>
  <script>SM.boot();</script>
</body>
</html>
